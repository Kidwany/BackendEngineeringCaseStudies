spring:
  application:
    name: distributed-lock-failure
  datasource:
    url: jdbc:postgresql://localhost:5401/app
    username: app
    password: app
  data:
    redis:
      host: localhost
      port: 6301
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8101

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
