spring:
  application:
    name: payout-platform
  datasource:
    url: jdbc:postgresql://localhost:5401/payout
    username: payout
    password: payout
  jpa:
    # Flyway owns the schema (db/migration). Hibernate only checks entities against it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9401

server:
  port: 8101

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-components: always
