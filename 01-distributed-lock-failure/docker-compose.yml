name: 01-distributed-lock-failure

services:
  payout-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5401:5432"
    volumes:
      - payout-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6301:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  payout-platform:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: payout-platform
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payout-postgres:5432/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    ports:
      - "8101:8101"
    depends_on:
      payout-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8101/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  payout-worker:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: payout-worker
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8102:8102"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8102/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  fake-bank:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: fake-bank
    ports:
      - "8103:8103"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8103/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  payout-pgdata:
