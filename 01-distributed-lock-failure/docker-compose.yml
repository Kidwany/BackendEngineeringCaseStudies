name: 01-distributed-lock-failure

services:
  payout-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: payout
      POSTGRES_USER: payout
      POSTGRES_PASSWORD: payout
    ports:
      - "5401:5432"
    volumes:
      - payout-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payout -d payout"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The bank is an external system: its own database, never shared with the platform.
  bank-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports:
      - "5403:5432"
    volumes:
      - bank-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6301:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node KRaft broker. Containers reach it on kafka:29092, the host on localhost:9401.
  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9401
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9401:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  payout-platform:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: payout-platform
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payout-postgres:5432/payout
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8101:8101"
    depends_on:
      payout-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8101/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  payout-worker:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: payout-worker
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FAKE_BANK_BASE_URL: http://fake-bank:8103
    ports:
      - "8102:8102"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      fake-bank:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8102/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  fake-bank:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: fake-bank
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://bank-postgres:5432/bank
    ports:
      - "8103:8103"
    depends_on:
      bank-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8103/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  payout-pgdata:
  bank-pgdata:
